name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Validate release version
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lockfile = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = manifest.version;
          if (typeof manifest.publisher !== 'string' || !/^[a-z0-9][a-z0-9-]*$/i.test(manifest.publisher)) {
            throw new Error('Set package.json publisher to the registered Marketplace publisher ID');
          }
          if (typeof version !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Release version must use MAJOR.MINOR.PATCH');
          }
          // Check both lockfile versions before building or publishing any artifact.
          // 构建或发布产物前核对锁文件的两处版本
          for (const actual of [lockfile.version, lockfile.packages?.['']?.version]) {
            if (actual !== version) {
              throw new Error('package.json and package-lock.json versions must match');
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\n`);
          NODE
      - name: Skip an existing release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        # Fail on API errors so an unavailable release list cannot be mistaken for a new version.
        # API 请求失败时终止，避免将无法读取的发行版列表误认为尚未发布
        run: |
          release_tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          while IFS= read -r tag; do
            if [[ "$tag" == "$RELEASE_TAG" ]]; then
              echo "Release $RELEASE_TAG already exists; skipping."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$release_tags"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Validate existing tag target
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        # An existing tag must identify the same source as the package being published.
        # 已有标签必须与待发布产物使用同一份源码
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
            if [[ "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
              echo "Tag $RELEASE_TAG points to another commit; update the package version." >&2
              exit 1
            fi
          fi

  build:
    needs: prepare
    # Marketplace can still need this version when its GitHub Release already exists.
    # GitHub Release 已存在时，Marketplace 仍可能需要发布该版本
    uses: ./.github/workflows/ci.yml
    with:
      package: true

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Publish the checked artifact without rebuilding with a write-enabled token.
      # 直接发布已检查的产物，避免携带写入令牌重新执行构建
      - name: Download checked VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-ubuntu-latest
          path: release
      - name: Create release with VSIX and checksum
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          shopt -s nullglob
          packages=(*.vsix)
          expected="go-interfaces-impl-${RELEASE_TAG#v}.vsix"
          if [[ ${#packages[@]} -ne 1 || "${packages[0]}" != "$expected" ]]; then
            echo "Expected exactly one package: $expected" >&2
            exit 1
          fi
          sha256sum "$expected" > SHA256SUMS
          gh release create "$RELEASE_TAG" "$expected" SHA256SUMS \
            --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes

  marketplace:
    name: Publish VS Code Marketplace
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked publishing tools
        run: npm ci
      - name: Download checked VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-ubuntu-latest
          path: release
      # Authenticate with this workflow's identity and reuse the checked package unchanged.
      # 使用当前工作流身份认证，直接复用已检查的安装包
      - name: Publish with trusted identity
        shell: bash
        run: |
          package_name=$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.vsix'")
          test -f "release/$package_name"
          npx --no-install vsce publish --oidc --skip-duplicate --packagePath "release/$package_name"
